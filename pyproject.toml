[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acta-mcp"
version = "0.1.0"
description = "Servidor MCP modular para os domínios do ACTA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.23.2",
    "psycopg[binary,pool]>=3.2,<4",
    "pymongo>=4.10,<5",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "qdrant-client>=1.16,<2",
    "python-pptx>=1.0,<2",
    "reportlab>=4.2,<5",
    "scikit-learn>=1.6,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
acta-mcp = "acta_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acta_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requer PostgreSQL, MongoDB e Qdrant configurados",
    "contract: valida o protocolo MCP",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
