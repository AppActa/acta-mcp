name: Integração MCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    environment: test
    
    env:
      ACTA_ENV: test
      ACTA_AUTH_MODE: disabled
    
      TEST_DATABASE_URL: postgresql://acta:acta@localhost:5433/acta
      TEST_MONGODB_URI: mongodb://localhost:27018
      TEST_QDRANT_CLUSTER_ENDPOINT: ${{ secrets.TEST_QDRANT_CLUSTER_ENDPOINT }}
      TEST_QDRANT_API_KEY: ${{ secrets.TEST_QDRANT_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Subir PostgreSQL e MongoDB
        run: docker compose up -d --wait

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes
        run: pytest -q
