services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acta
      POSTGRES_USER: acta
      POSTGRES_PASSWORD: acta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acta -d acta"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./tests/fixtures/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./tests/fixtures/mongodb/init.js:/docker-entrypoint-initdb.d/001-init.js:ro

