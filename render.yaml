services:
  - type: web
    name: acta-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ACTA_ENV
        value: production
      - key: ACTA_AUTH_MODE
        value: api_key
      - key: ACTA_MCP_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: acta
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: acta_faq
      - key: ACTA_LOG_LEVEL
        value: INFO
