name: ACTA MCP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://acta:acta@localhost:5433/acta
      TEST_MONGODB_URI: mongodb://localhost:27018

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          python-version: "3.12"

      - run: make validate

      - if: always()
        run: docker compose down -v
