services:
  - type: web
    name: acta-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ACTA_ENV
        value: production
      - key: ACTA_AUTH_MODE
        value: api_key
      - key: ACTA_MCP_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: acta
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_FAQ_COLLECTION
        value: acta_faq
      - key: QDRANT_TIMEOUT_SECONDS
        value: "10"
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ACTA_LOG_LEVEL
        value: INFO
